name: open_pro
description: "OpenPro - Next-Generation AI-Powered Professional Network & Recruiter-Talent Matching Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  get_it: ^9.3.0
  sqflite: ^2.4.5
  sqflite_common_ffi: ^2.4.5
  shared_preferences: ^2.5.6
  dio: ^5.11.1
  connectivity_plus: ^7.3.2
  fl_chart: ^1.3.0
  intl: ^0.20.3
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
